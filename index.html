<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All in One Media Downloader</title>
    <style>
        body {
            background-color: #0B0F19; /* डार्क थीम */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        h1 { margin-bottom: 5px; }
        p { color: #00BFFF; margin-bottom: 40px; }
        .box {
            background: #111827;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 500px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #1F2937;
            color: white;
            outline: none;
        }
        button {
            padding: 12px 30px;
            background: linear-gradient(90deg, #00BFFF, #0055FF);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>All in One Media Downloader</h1>
    <p>Fast & Direct Download</p>

    <div class="box">
        <input type="text" id="videoUrl" placeholder="यहाँ YouTube या Instagram का लिंक डालें...">
        <br>
        <button onclick="downloadVideo()">Get Download Link</button>
    </div>

    <script>
        function downloadVideo() {
            let url = document.getElementById('videoUrl').value;
            
            if (!url) {
                alert("Please enter a link first! (कृपया पहले लिंक डालें)");
                return;
            }

            // Instagram के लिए 
            if (url.includes("instagram.com")) {
                let finalUrl = "https://snapinsta.app/?url=" + encodeURIComponent(url);
                window.open(finalUrl, "_blank");
            } 
            // YouTube के लिए
            else if (url.includes("youtube.com") || url.includes("youtu.be")) {
                let finalUrl = "https://ssyoutube.com/en166/?url=" + encodeURIComponent(url);
                window.open(finalUrl, "_blank");
            } 
            // अगर कोई गलत लिंक डाले
            else {
                alert("Currently, only YouTube and Instagram links are supported!");
            }
        }
    </script>

</body>
</html>
